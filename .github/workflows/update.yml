name: Обновить курсы
on:
  schedule:
    - cron: "7,37 * * * *"   # каждые 30 минут
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install beautifulsoup4 telethon
      - run: python scrape.py
      - name: Telegram-чат обменников
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python tg_scrape.py
      - name: Сохранить rates.json
        run: |
          git config user.name "kurs-bot"
          git config user.email "kurs-bot@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || git commit -m "Курсы $(TZ=Europe/Moscow date +'%d.%m %H:%M')"
          git push
